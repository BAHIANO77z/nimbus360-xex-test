name: XEX de teste (OpenXeChain)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PREFIX: ${{ github.workspace }}/sysroot
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 python3-yaml gawk bzip2 zip unzip git build-essential

      - name: Restaurar cache da toolchain
        uses: actions/cache/restore@v4
        with:
          path: sysroot
          key: openxechain-v2-${{ github.run_id }}
          restore-keys: openxechain-v2-

      - name: Ver se a toolchain ja esta pronta
        id: tc
        run: |
          if [ -x sysroot/bin/synthxex ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

      - name: Compilar a toolchain (continua de onde parou)
        id: tcbuild
        if: steps.tc.outputs.done != 'true'
        continue-on-error: true
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/OpenXeChain/buildscript.git oxc
          cd oxc
          sed -i 's|CPP="${PREFIX}/bin/clang-cpp"|CPP="${PREFIX}/bin/clang -E"|' build-toolchain.sh
          sed -i 's|-DCOMPILER_RT_BUILD_BUILTINS=true|-DCOMPILER_RT_BUILD_BUILTINS=true -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=ON|' build-toolchain.sh
          sudo rm -rf /usr/lib/llvm-*/cmake /usr/lib/llvm-*/lib/cmake/llvm || true
          export HOST_CC=clang HOST_CXX=clang++
          if [ -f ../sysroot/lib/generic/libclang_rt.builtins-powerpc.a ]; then START='# Build SynthXEX'
          elif [ -f ../sysroot/ppc-xbox360/lib/libc.a ]; then START='# Configure compiler-rt'
          else START=''; fi
          echo "Ponto de partida: '$START'"
          if [ -z "$START" ]; then
            ./build-toolchain.sh
          else
            a=$(grep -n -F 'cd "$(dirname $0)" || fail_build' build-toolchain.sh | head -1 | cut -d: -f1)
            b=$(grep -n -F "$START" build-toolchain.sh | head -1 | cut -d: -f1)
            {
              sed -n "1,$((a-1))p" build-toolchain.sh
              echo 'cd "$(dirname $0)" || fail_build'
              echo 'mkdir -p build && cd build && rm -rf ./* || fail_build'
              echo 'OLD_LIBRARY_PATH=""; OLD_C_INCLUDE_PATH=""; OLD_CPLUS_INCLUDE_PATH=""'
              echo 'export LIBRARY_PATH="" C_INCLUDE_PATH="" CPLUS_INCLUDE_PATH=""'
              sed -n "${b},\$p" build-toolchain.sh
            } > resume.sh
            bash ./resume.sh
          fi

      - name: Mostrar erro da toolchain
        if: steps.tcbuild.outcome == 'failure'
        run: |
          echo "=== fim do build.log ==="
          tail -n 60 oxc/build.log || true

      - name: Guardar cache da toolchain
        if: always() && steps.tc.outputs.done != 'true'
        uses: actions/cache/save@v4
        with:
          path: sysroot
          key: openxechain-v2-${{ github.run_id }}

      - name: Parar se a toolchain falhou
        if: steps.tcbuild.outcome == 'failure'
        run: exit 1

      - name: Compilar o XEX de teste
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$PWD/sysroot/bin:$PATH"
          export C_INCLUDE_PATH="" CPLUS_INCLUDE_PATH="" LIBRARY_PATH=""
          mkdir -p out
          clang -O2 hello.c -o out/hello.exe 2>&1 | tee out/compile.log
          synthxex -i out/hello.exe -o out/default.xex -t title 2>&1 | tee out/synthxex.log
          test -s out/default.xex
          ls -la out

      - name: Enviar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xex-teste
          path: out/
